<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – ShopSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">

</head>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── LIGHT MODE (default) ── */
:root {
    --orange: #FF6B2B;
    --amber:  #f59e0b;
    --dark:   #1a1a2e;
    --muted:  #6b7280;
    --border: #e5e7eb;
    --surface:#f9fafb;
    --body-bg: linear-gradient(135deg, #fde8d8 0%, #d4f4f8 50%, #f5e6ff 100%);
    --card-bg: #ffffff;
    --input-bg: #f9fafb;
    --input-color: #1a1a2e;
    --label-color: #374151;
    --heading-color: #1a1a2e;
    --subtitle-color: #6b7280;
    --signup-color: #6b7280;
    --brand-color: #1a1a2e;
}

/* ── DARK MODE ── */
[data-theme="dark"] {
    --body-bg: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #0f0f1a 100%);
    --card-bg: #12121a;
    --input-bg: #1a1a26;
    --input-color: #f0eee8;
    --border: rgba(255,255,255,0.1);
    --label-color: #a0a0b0;
    --heading-color: #f0eee8;
    --subtitle-color: #6a6a7a;
    --signup-color: #6a6a7a;
    --brand-color: #f0eee8;
    --muted: #6a6a7a;
    --surface: #1a1a26;
    --dark: #f0eee8;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--body-bg);
    padding: 20px 20px 80px;
    overflow-x: hidden;
    transition: background 0.3s;
}

/* ── CARD ── */
.box {
    width: 900px;
    max-width: 100%;
    min-height: 540px;
    background: var(--card-bg);
    border-radius: 28px;
    transition: background 0.3s;
    box-shadow: 0 30px 80px rgba(0,0,0,0.14);
    display: grid;
    grid-template-columns: 1fr 420px;
    overflow: hidden;
    position: relative;
    animation: cardIn 0.7s cubic-bezier(.22,1,.36,1) both;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── LEFT column ── */
.form-side {
    grid-column: 1;
    display: flex;
    flex-direction: column;
    padding: 52px 44px 44px;
    animation: fadeUp 0.8s 0.15s cubic-bezier(.22,1,.36,1) both;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* Brand mark row */
.brand-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
}

.brand-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--orange), var(--amber));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(255,107,43,0.35);
    position: relative;
    animation: iconPop 0.6s 0.4s cubic-bezier(.34,1.56,.64,1) both;
    overflow: hidden;
}

/* Mini S inside brand icon */
.brand-icon svg { width: 24px; height: 24px; }

@keyframes iconPop {
    from { opacity: 0; transform: scale(0.5) rotate(-15deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
}

.brand-icon::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 12px;
    border: 2px solid rgba(255,107,43,0.3);
    animation: ringPulse 2s 1s ease-in-out infinite;
}

@keyframes ringPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50%       { opacity: 0.7; transform: scale(1.08); }
}

.brand-name {
    font-family: 'Fredoka One', sans-serif;
    font-size: 20px; font-weight: 400; color: var(--brand-color); letter-spacing: -0.3px;
}
.brand-name span { color: var(--orange); }

/* Heading */
.form-side h2 {
    font-size: 28px; font-weight: 800; color: var(--heading-color);
    margin-bottom: 6px; line-height: 1.2;
}
.form-side .subtitle {
    font-size: 13px; color: var(--subtitle-color); margin-bottom: 28px;
}

/* ── FORM ── */
form { display: flex; flex-direction: column; }

.field {
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
    animation: fieldSlide 0.6s cubic-bezier(.22,1,.36,1) both;
}
.field:nth-child(1) { animation-delay: 0.25s; }
.field:nth-child(2) { animation-delay: 0.35s; }

@keyframes fieldSlide {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: translateX(0); }
}

.field label {
    font-size: 12px; font-weight: 700; color: var(--label-color);
    letter-spacing: 0.3px; margin-bottom: 6px;
}

.input-wrap { position: relative; }

.input-wrap .icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: #9ca3af; pointer-events: none;
    transition: color 0.2s;
    display: flex; align-items: center;
}

input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    color: var(--input-color);
    background: var(--input-bg);
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    outline: none;
}
input:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(255,107,43,0.12);
    background: #fff;
}
input:focus ~ .focus-bar { transform: scaleX(1); }
.input-wrap:focus-within .icon { color: var(--orange); }
input::placeholder { color: #9ca3af; }

.focus-bar {
    height: 2px;
    background: linear-gradient(90deg, var(--orange), var(--amber));
    border-radius: 999px;
    margin-top: 3px;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s cubic-bezier(.4,0,.2,1);
}

/* ── ERROR ── */
.error {
    color: #ef4444;
    font-size: 13px;
    padding: 9px 12px;
    background: #fef2f2;
    border-radius: 8px;
    border: 1px solid #fecaca;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 7px;
    animation: shakeIn 0.4s ease;
}
@keyframes shakeIn {
    0%   { transform: translateX(-6px); opacity: 0; }
    40%  { transform: translateX(4px); }
    70%  { transform: translateX(-3px); }
    100% { transform: translateX(0); opacity: 1; }
}

/* ── SUBMIT ── */
button[type="submit"] {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--orange), var(--amber));
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px; font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: transform 0.25s, box-shadow 0.25s;
    box-shadow: 0 6px 20px rgba(255,107,43,0.3);
    position: relative; overflow: hidden;
    animation: fieldSlide 0.6s 0.45s cubic-bezier(.22,1,.36,1) both;
}
button[type="submit"]::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.55s ease;
}
button[type="submit"]:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,107,43,0.45); }
button[type="submit"]:hover::after { transform: translateX(100%); }
button[type="submit"]:active { transform: translateY(0); }

/* ── SIGNUP LINK ── */
.signup-row {
    margin-top: 18px;
    font-size: 13px; color: var(--signup-color); text-align: center;
    animation: fieldSlide 0.6s 0.55s cubic-bezier(.22,1,.36,1) both;
}
a { color: var(--orange); text-decoration: none; font-weight: 700; }
a:hover { text-decoration: underline; }

/* ══════════════════════════════════
   RIGHT PANEL
═══════════════════════════════════ */
.right-panel {
    grid-column: 2;
    background: linear-gradient(145deg, #160330 0%, #240852 45%, #130d38 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 20px 32px;
    position: relative;
    overflow: hidden;
}

/* deep glow orb behind logo */
.right-panel::before {
    content: '';
    position: absolute;
    width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,43,0.18) 0%, transparent 68%);
    top: 50%; left: 50%; transform: translate(-50%, -58%);
    animation: orbPulse 3.5s ease-in-out infinite;
}
@keyframes orbPulse {
    0%, 100% { transform: translate(-50%,-58%) scale(1);   opacity: 0.7; }
    50%       { transform: translate(-50%,-58%) scale(1.18); opacity: 1; }
}

/* Floating particles */
.particle {
    position: absolute;
    border-radius: 50%;
    background: var(--orange);
    opacity: 0;
    animation: floatUp linear infinite;
}
@keyframes floatUp {
    0%   { transform: translateY(0) scale(0); opacity: 0; }
    10%  { opacity: 0.55; }
    90%  { opacity: 0.15; }
    100% { transform: translateY(-340px) scale(1.4); opacity: 0; }
}

/* Logo wrapper — clips & centres the SVG */
.logo-wrap {
    position: relative; z-index: 2;
    width: 100%;
    max-width: 340px;
    /* Animate orbiting items on the logo */
}

/* Orbit ring animation applied to logo's orbit group via JS class */
.logo-wrap svg .orbit-group {
    transform-origin: 170px 95px; /* centre of the logo icon area (scaled) */
    animation: logoOrbit 20s linear infinite;
}
@keyframes logoOrbit {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

/* Subtle float on whole logo */
.logo-float {
    animation: logoFloat 4s ease-in-out infinite;
}
@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
}

/* Pills row */
.pills {
    display: flex; gap: 7px; flex-wrap: wrap; justify-content: center;
    position: relative; z-index: 2;
    margin-top: 4px;
}
.pill {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 11px; color: #c4b5d4; font-weight: 600;
    backdrop-filter: blur(4px);
    animation: pillFade 0.5s ease both;
}
.pill:nth-child(1) { animation-delay: 0.9s; }
.pill:nth-child(2) { animation-delay: 1.05s; }
.pill:nth-child(3) { animation-delay: 1.2s; }
@keyframes pillFade {
    from { opacity: 0; transform: scale(0.85) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
}

/* ── FOOTER ── */
.footer {
    position: fixed; bottom: 0; left: 0;
    width: 100%; height: 52px;
    background: linear-gradient(90deg, #111827, #1f2937, #0f766e);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; z-index: 1000; font-family: inherit;
}



@media(max-width:700px){
    .box { grid-template-columns: 1fr; }
    .right-panel { display: none; }
    .form-side { padding: 36px 28px 32px; }
}
</style>
<body>
<script>
  (function(){
    var theme = localStorage.getItem('shopsphere-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<div class="box">

    <!-- ══ LEFT: Form side ══ -->
    <div class="form-side">

        <!-- Brand mark: mini logo icon + wordmark -->
        <div class="brand-mark">
            <div class="brand-icon">
                <!-- Mini S path from the logo, white on orange -->
                <svg viewBox="280 120 100 150" xmlns="http://www.w3.org/2000/svg">
                    <path d="M312 144 Q312 122 340 122 Q374 122 374 148 Q374 174 308 194 Q280 204 280 232 Q280 260 314 265 Q342 268 374 256"
                          fill="none" stroke="white" stroke-width="18" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="brand-name">Shop<span>Sphere</span></div>
        </div>

        <h2>Welcome back 👋</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <form method="POST" autocomplete="off">

            <!-- Email -->
            <div class="field">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="off" required>
                    <div class="focus-bar"></div>
                </div>
            </div>

            <!-- Password -->
            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" required>
                    <div class="focus-bar"></div>
                </div>
            </div>

            <!-- Error (Jinja2 template) -->
            {% if error %}
            <div class="error">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <!-- Submit -->
            <button type="submit">Login →</button>

        </form>

        <p class="signup-row">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>

    <!-- ══ RIGHT: ShopSphere logo panel ══ -->
    <div class="right-panel" id="rightPanel">

        <!-- Full ShopSphere logo SVG, adapted for dark panel -->
        <div class="logo-wrap logo-float">
            <svg viewBox="130 30 420 460" xmlns="http://www.w3.org/2000/svg">

                <!-- Glow rings around icon -->
                <circle cx="340" cy="190" r="148" fill="#FF6B2B" opacity="0.03"/>
                <circle cx="340" cy="190" r="134" fill="#FF6B2B" opacity="0.05"/>

                <!-- Thick ring -->
                <circle cx="340" cy="190" r="118" fill="none" stroke="#FF6B2B" stroke-width="18" opacity="0.10"/>
                <circle cx="340" cy="190" r="118" fill="none" stroke="#FFB547" stroke-width="6"  opacity="0.22" stroke-dasharray="12 8"/>
                <circle cx="340" cy="190" r="118" fill="none" stroke="#FF6B2B" stroke-width="2.5" opacity="0.55"/>

                <!-- Inner plate — translucent on dark bg -->
                <circle cx="340" cy="190" r="100" fill="rgba(255,247,237,0.07)"/>
                <circle cx="340" cy="190" r="100" fill="none" stroke="#FF6B2B" stroke-width="2" opacity="0.25"/>
                <circle cx="340" cy="190" r="86"  fill="none" stroke="#FF6B2B" stroke-width="1" stroke-dasharray="6 5" opacity="0.20"/>

                <!-- Giant S — bright on dark -->
                <path d="M312 144 Q312 122 340 122 Q374 122 374 148 Q374 174 308 194 Q280 204 280 232 Q280 260 314 265 Q342 268 374 256"
                      fill="none" stroke="#FF6B2B" stroke-width="26" stroke-linecap="round" opacity="0.18"/>
                <path d="M312 144 Q312 122 340 122 Q374 122 374 148 Q374 174 308 194 Q280 204 280 232 Q280 260 314 265 Q342 268 374 256"
                      fill="none" stroke="#FF6B2B" stroke-width="16" stroke-linecap="round"/>
                <path d="M312 144 Q312 122 340 122 Q374 122 374 148 Q374 174 308 194 Q280 204 280 232 Q280 260 314 265 Q342 268 374 256"
                      fill="none" stroke="#FFDABC" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

                <!-- Orbit group — spins via CSS -->
                <g id="orbitGroup">
                    <!-- TOP: % badge -->
                    <circle cx="340" cy="58" r="22" fill="#FFB547"/>
                    <circle cx="340" cy="58" r="16" fill="#FFD580"/>
                    <text x="340" y="64" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#7a4500">%</text>
                    <line x1="340" y1="30" x2="340" y2="22" stroke="#FFB547" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                    <line x1="362" y1="36" x2="368" y2="28" stroke="#FFB547" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
                    <line x1="318" y1="36" x2="312" y2="28" stroke="#FFB547" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

                    <!-- RIGHT: Shopping bag -->
                    <g transform="translate(455,172)">
                        <rect x="-24" y="0" width="48" height="40" rx="9" fill="#FF6B2B"/>
                        <rect x="-24" y="0" width="48" height="14" rx="9" fill="#FF8C55" opacity="0.6"/>
                        <path d="M-12,0 Q-12,-18 0,-18 Q12,-18 12,0" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>

                        <circle cx="-8" cy="37" r="5" fill="#130d38"/><circle cx="-8" cy="37" r="3" fill="#FF6B2B"/>
                    </g>

                    <!-- LEFT: Price tag -->
                    <g transform="translate(222,172)">
                        <rect x="-26" y="-18" width="52" height="36" rx="9" fill="#FFB547"/>
                        <circle cx="-16" cy="0" r="5" fill="white" opacity="0.55"/>
                        <line x1="-8" y1="-7" x2="18" y2="-7" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                        <line x1="-8" y1="1"  x2="14" y2="1"  stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
                        <line x1="-8" y1="9"  x2="10" y2="9"  stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
                    </g>

                    <!-- BOTTOM-RIGHT: Cart -->
                    <g transform="translate(428,278)">
                        <rect x="-28" y="-26" width="56" height="44" rx="10" fill="#1a1a2e" opacity="0.88"/>
                        <path d="M-16,-10 L-8,-10 L0,10 L18,10 L24,-4 L-4,-4" fill="none" stroke="#FF6B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="4"  cy="17" r="4" fill="#FFB547"/>
                        <circle cx="16" cy="17" r="4" fill="#FFB547"/>
                    </g>

                    <!-- BOTTOM-LEFT: Heart -->
                    <g transform="translate(252,278)">
                        <rect x="-28" y="-26" width="56" height="44" rx="10" fill="#FF6B2B"/>
                        <path d="M0,12 Q-22,-4 -18,-16 Q-14,-26 0,-14 Q14,-26 18,-16 Q22,-4 0,12Z" fill="white" opacity="0.9"/>
                    </g>

                    <!-- Dashed orbit -->
                    <circle cx="340" cy="190" r="118" fill="none" stroke="#FF6B2B" stroke-width="1" stroke-dasharray="5 6" opacity="0.20"/>

                    <!-- Dot accents on orbit -->
                    <circle cx="490" cy="192" r="5" fill="#FF6B2B" opacity="0.30"/>
                    <circle cx="190" cy="192" r="5" fill="#FFB547" opacity="0.30"/>
                </g>

                <!-- Sparkles -->
                <g transform="translate(490,100)">
                    <line x1="0" y1="-11" x2="0" y2="11"  stroke="#FFB547" stroke-width="3"   stroke-linecap="round"/>
                    <line x1="-11" y1="0" x2="11" y2="0"  stroke="#FFB547" stroke-width="3"   stroke-linecap="round"/>
                    <line x1="-7"  y1="-7" x2="7" y2="7"  stroke="#FFB547" stroke-width="2"   stroke-linecap="round" opacity="0.5"/>
                    <line x1="7"   y1="-7" x2="-7" y2="7" stroke="#FFB547" stroke-width="2"   stroke-linecap="round" opacity="0.5"/>
                </g>
                <g transform="translate(188,100)">
                    <line x1="0" y1="-9" x2="0" y2="9"   stroke="#FF6B2B" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="-9" y1="0" x2="9" y2="0"   stroke="#FF6B2B" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="-6" y1="-6" x2="6" y2="6"  stroke="#FF6B2B" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
                    <line x1="6"  y1="-6" x2="-6" y2="6" stroke="#FF6B2B" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
                </g>
                <g transform="translate(500,280)">
                    <line x1="0" y1="-7" x2="0" y2="7"  stroke="#FFB547" stroke-width="2" stroke-linecap="round"/>
                    <line x1="-7" y1="0" x2="7" y2="0"  stroke="#FFB547" stroke-width="2" stroke-linecap="round"/>
                </g>
                <g transform="translate(182,280)">
                    <line x1="0" y1="-7" x2="0" y2="7"  stroke="#FF6B2B" stroke-width="2" stroke-linecap="round"/>
                    <line x1="-7" y1="0" x2="7" y2="0"  stroke="#FF6B2B" stroke-width="2" stroke-linecap="round"/>
                </g>

                <!-- Wordmark -->
                <text x="340" y="404" text-anchor="middle" font-family="'Fredoka One', Nunito, sans-serif" font-size="76" font-weight="900">
                    <tspan fill="#F0EEE8">Shop</tspan><tspan fill="#FF6B2B">Sphere</tspan>
                </text>

                <!-- Underline bars -->
                <rect x="178" y="414" width="152" height="4" rx="2" fill="white" opacity="0.12"/>
                <rect x="334" y="414" width="168" height="4" rx="2" fill="#FF6B2B" opacity="0.55"/>

<script>
// ── Orbit animation on the logo group ──
(function(){
    var orbitGroup = document.getElementById('orbitGroup');
    if(!orbitGroup) return;
    var angle = 0;
    var cx = 340, cy = 190;
    function tick(){
        angle += 0.012; // degrees per frame — slow orbit
        var rad = angle * Math.PI / 180;
        var cos = Math.cos(rad), sin = Math.sin(rad);
        orbitGroup.setAttribute('transform',
            'rotate(' + angle.toFixed(3) + ' ' + cx + ' ' + cy + ')'
        );
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
})();

// ── Floating particles ──
(function(){
    var panel = document.getElementById('rightPanel');
    if(!panel) return;
    for(var i = 0; i < 16; i++){
        var p = document.createElement('div');
        p.className = 'particle';
        var size  = (Math.random() * 5 + 2).toFixed(1);
        var left  = (Math.random() * 90 + 5).toFixed(1);
        var dur   = (Math.random() * 9 + 6).toFixed(1);
        var delay = (Math.random() * 9).toFixed(1);
        p.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+left+'%;bottom:0;animation-duration:'+dur+'s;animation-delay:'+delay+'s;';
        panel.appendChild(p);
    }
})();

</script>
