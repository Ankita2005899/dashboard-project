<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Owner Verification</title>
<style>
/* ===== THEME VARIABLES ===== */
:root {
    --page-bg:     #d4f4f8;
    --card-bg:     #ffffff;
    --card-text:   #1a1a2e;
    --input-bg:    #ffffff;
    --input-color: #1a1a2e;
    --input-border:#ccc;
    --grid-bg: linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
               linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
    --grid-size: 50px 50px;
}

[data-theme="dark"] {
    --page-bg:     #0a0a0f;
    --card-bg:     #12121a;
    --card-text:   #f0eee8;
    --input-bg:    #1e1e2e;
    --input-color: #f0eee8;
    --input-border:rgba(255,255,255,0.15);
    --grid-bg: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
               linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    --grid-size: 50px 50px;
}

/* Grid pattern overlay */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: var(--grid-bg);
    background-size: var(--grid-size);
    pointer-events: none;
}

body{
    font-family:"Segoe UI";
    background: var(--page-bg);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    transition: background 0.3s;
}
.box{
    background:var(--card-bg);
    color:var(--card-text);
    padding:40px;
    border-radius:12px;
    width:400px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    position:relative;
    z-index:1;
    transition: background 0.3s, color 0.3s;
}
.box h2, .box p {
    color:var(--card-text);
}
input{
    width:100%;
    padding:10px;
    margin-top:15px;
    border-radius:8px;
    border:1px solid var(--input-border);
    background:var(--input-bg);
    color:var(--input-color);
    transition: background 0.3s, color 0.3s, border-color 0.3s;
}
button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#10b981;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* ================= FOOTER ================= */
.footer{
    position:fixed;

    bottom:0;
    left:0;

    width:100%;
    height:60px;

    background:linear-gradient(90deg,#111827,#1f2937,#0f766e);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;

    z-index:1000;
}
</style>
</head>
<body>

<script>
  (function(){
    var theme = localStorage.getItem('shopsphere-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<div class="box">
<h2>👑 Owner Verification</h2>
<p>OTP will be sent to registered owner email</p>

<button onclick="sendOTP()">Send OTP</button>
<input id="otpInput" placeholder="Enter 9 digit OTP">
<button onclick="verifyOTP()">Verify OTP</button>
</div>

<script>

function sendOTP(){
    // First wake up the server
    fetch("/send-owner-otp")
    .then(res => {
        if (!res.ok) throw new Error("Server error");
        return res.json();
    })
    .then(data => {
        if(data.success){
            alert("✅ OTP sent to owner email. Please check your inbox.");
        } else {
            alert("❌ Failed to send OTP. " + (data.error || ""));
        }
    })
    .catch(err => {
        // Server was sleeping, try again after 3 seconds
        setTimeout(() => {
            alert("⏳ Server was sleeping, trying again...");
            sendOTP();
        }, 3000);
    });
}

function verifyOTP(){
    const otp = document.getElementById("otpInput").value;
    fetch("/verify-owner-otp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({otp: otp})
    })
    .then(res => res.json())
    .then(data => {
        if(data.success){
            alert("✅ OTP verified successfully! You are authorized.");
            window.location.href = "/owner-dashboard";
        } else {
            alert("❌ Invalid OTP. Try again.");
        }
    })
    .catch(err => {
        alert("❌ Error verifying OTP: " + err);
    });
}
</script>
<footer class="footer">
    © 2026 Product Dashboard | All Rights Reserved
</footer>
</body>
</html>
